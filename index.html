<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY PURPOSE - あなたの使命を解読する</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #1a1a2e;
            --bg-card: #16213e;
            --gold: #d4af37;
            --red: #dc143c;
            --text-primary: #fff8f0;
            --text-secondary: #b8b8b8;
        }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'ヒラギノ角ゴ ProN', 'Yu Gothic', '游ゴシック', 'Meiryo', 'メイリオ', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #0f3460 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, var(--gold), #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 0.1em;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .card {
            background: rgba(22, 33, 62, 0.9);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--gold);
            font-weight: bold;
            font-size: 1.05rem;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1.05rem;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.15);
        }

        input::placeholder {
            color: rgba(184, 184, 184, 0.5);
        }

        /* セレクトボックスの視認性向上 */
        select {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-weight: 500;
        }

        select option {
            background: #1a1a2e;
            color: #ffffff;
            padding: 10px;
        }

        select option:disabled {
            color: #666666;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, var(--gold), #ffd700);
            border: none;
            border-radius: 10px;
            color: var(--bg-dark);
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        #loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top: 4px solid var(--gold);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-section {
            margin-bottom: 40px;
        }

        /* 全体タイトル */
        .main-title {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }

        .main-title h2 {
            font-size: 1.8rem;
            background: linear-gradient(45deg, var(--gold), #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        .main-title p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            letter-spacing: 0.12em;
        }

        /* セクションタイトル（全セクション統一） */
        .result-title {
            color: var(--gold);
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 0.08em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
        }

        .result-content {
            line-height: 1.9;
            font-size: 1.05rem;
        }

        .sound-analysis {
            display: grid;
            gap: 20px;
            margin: 20px 0;
        }

        .sound-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid var(--gold);
        }

        .sound-char {
            display: inline-block;
            width: 65px;
            height: 65px;
            line-height: 65px;
            text-align: center;
            background: linear-gradient(135deg, var(--gold), #ffd700);
            color: var(--bg-dark);
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 50%;
            margin-right: 15px;
            vertical-align: middle;
        }

        .sound-meaning {
            font-size: 1.3rem;
            color: var(--gold);
            font-weight: bold;
            vertical-align: middle;
        }

        .sound-desc {
            margin-top: 15px;
            padding-left: 80px;
            line-height: 1.8;
        }

        .text-gold {
            color: var(--gold);
        }

        .text-red {
            color: var(--red);
        }

        .font-serif {
            font-family: serif;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            .card {
                padding: 25px 15px;
            }
            .sound-desc {
                padding-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MY PURPOSE</h1>
            <p>誰も教えてくれなかった、あなたの使命を解読する。</p>
        </div>

        <div class="card">
            <form id="diagnosisForm" onsubmit="event.preventDefault(); diagnose();">
                <div class="form-group">
                    <label for="sei">姓（ひらがな）</label>
                    <input type="text" id="sei" placeholder="みょうじ" value="">
                </div>
                
                <div class="form-group">
                    <label for="mei">名（ひらがな）</label>
                    <input type="text" id="mei" placeholder="なまえ" value="" required>
                </div>
                
                <div class="form-group">
                    <label for="birthYear">生年月日</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                        <select id="birthYear" required>
                            <option value="">年</option>
                        </select>
                        <select id="birthMonth" required>
                            <option value="">月</option>
                            <option value="1">1月</option>
                            <option value="2">2月</option>
                            <option value="3">3月</option>
                            <option value="4">4月</option>
                            <option value="5">5月</option>
                            <option value="6">6月</option>
                            <option value="7" selected>7月</option>
                            <option value="8">8月</option>
                            <option value="9">9月</option>
                            <option value="10">10月</option>
                            <option value="11">11月</option>
                            <option value="12">12月</option>
                        </select>
                        <select id="birthDay" required>
                            <option value="">日</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="gender">性別</label>
                    <select id="gender" required>
                        <option value="">選択してください</option>
                        <option value="male">男性</option>
                        <option value="female">女性</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="bloodType">血液型</label>
                    <select id="bloodType" required>
                        <option value="">選択してください</option>
                        <option value="A">A型</option>
                        <option value="B">B型</option>
                        <option value="O">O型</option>
                        <option value="AB">AB型</option>
                    </select>
                </div>
                
                <button type="submit" class="btn">使命を解読する</button>
            </form>
        </div>

        <div id="loading" style="display: none;">
            <div class="spinner"></div>
            <p style="color: var(--gold); font-size: 1.2rem;">診断中...</p>
        </div>

        <div id="results" style="display: none;"></div>
    </div>

    <script>
        // ============================================================================
        // データ定義
        // ============================================================================
        
        const KIGO_MASTER = {
            'あ': { char: '開拓者', desc: '新しい時代を切り拓く開拓者気質。直感と行動力で道を切り拓く。', talents: ['創造性', 'リーダーシップ', '行動力'], vowel: 'A' },
            'い': { char: '芸術家', desc: '繊細で感受性豊か。美的センスに優れ、精神的な深さを持つ。', talents: ['感受性', '芸術的表現', '洞察力'], vowel: 'I' },
            'う': { char: '調和者', desc: '周囲との調和を大切にする柔らかな気質。包み込むような優しさ。', talents: ['調和性', '思いやり', '包容力'], vowel: 'U' },
            'え': { char: '適応者', desc: '変化への適応力が高い多面的な存在。柔軟に対応できる。', talents: ['適応力', '柔軟性', '多才さ'], vowel: 'E' },
            'お': { char: '統合者', desc: '全体をまとめ調和させる能力。大きな視野で物事を捉える。', talents: ['統合力', 'バランス感覚', '包容力'], vowel: 'O' },
            'か': { char: '行動家', desc: '社交的でエネルギッシュ。変化を好み、新しい環境に飛び込む。', talents: ['社交性', '行動力', '変化対応'], vowel: 'A' },
            'き': { char: '判断者', desc: '物事の本質を見極め決断できる。鋭い判断力を持つ。', talents: ['判断力', '決断力', '洞察力'], vowel: 'I' },
            'く': { char: '探究者', desc: '深い思考で本質を追究する。研究能力に優れる。', talents: ['深思考', '研究能力', '洞察力'], vowel: 'U' },
            'け': { char: '気配り', desc: '見えない領域への感度が高い。空気を読む力がある。', talents: ['気配り', '感受性', '直感力'], vowel: 'E' },
            'こ': { char: '実行者', desc: '理想を現実に変える実行力。堅実に物事を進める。', talents: ['実行力', '堅実性', '責任感'], vowel: 'O' },
            'さ': { char: '分析家', desc: '冷静で分析的。論理的思考で物事を整理する。', talents: ['分析力', '論理性', '客観性'], vowel: 'A' },
            'し': { char: '信念者', desc: '信念を貫く粘り強さ。一度決めたことをやり抜く。', talents: ['忍耐力', '信念', '一貫性'], vowel: 'I' },
            'す': { char: '調整者', desc: '物事をスムーズに進める能力。調整力に優れる。', talents: ['調整力', 'コミュニケーション', '気配り'], vowel: 'U' },
            'せ': { char: '正義者', desc: '清廉さと正義感が強い。曲がったことが嫌い。', talents: ['正義感', '誠実さ', '倫理性'], vowel: 'E' },
            'そ': { char: '支援者', desc: '陰で支える献身的な存在。縁の下の力持ち。', talents: ['サポート力', '献身性', '思いやり'], vowel: 'O' },
            'た': { char: '堅実者', desc: '大地のような安定感。現実的で責任感が強い。', talents: ['安定性', '責任感', '信頼性'], vowel: 'A' },
            'ち': { char: '多才者', desc: '多くの才能と興味を持つ。多面的な視点で捉える。', talents: ['多才さ', '柔軟性', '好奇心'], vowel: 'I' },
            'つ': { char: '達成者', desc: '目標に向かい一直線。執着力がある。', talents: ['執着力', '粘り強さ', '目標達成'], vowel: 'U' },
            'て': { char: '工夫者', desc: '手作業と工夫に秀でている。器用で実践的。', talents: ['器用さ', '技術力', '工夫心'], vowel: 'E' },
            'と': { char: '革新者', desc: '枠を破る革新力。既成概念にとらわれない。', talents: ['革新性', '突破力', '先見性'], vowel: 'O' },
            'な': { char: '調和者', desc: '調和と流れを大切にする。自然体で溶け込む。', talents: ['調和性', '適応力', '共感力'], vowel: 'A' },
            'に': { char: '分析者', desc: '物事を分析し区別する能力。比較検討が得意。', talents: ['分析力', '比較能力', '論理性'], vowel: 'I' },
            'ぬ': { char: '深掘り', desc: '本質を究める徹底性。一つのことを極める。', talents: ['深掘り力', '徹底性', '専門性'], vowel: 'U' },
            'ね': { char: '基礎者', desc: '深く根を張る継続力。基礎をしっかり固める。', talents: ['継続力', '基礎構築', '忍耐力'], vowel: 'E' },
            'の': { char: '自由人', desc: 'のびのびとした自由さ。束縛を嫌う。', talents: ['自由性', '開放性', '創造性'], vowel: 'O' },
            'は': { char: '波動者', desc: '波のようなリズム感。流れを感じ取る。', talents: ['リズム感', '適応性', '直感力'], vowel: 'A' },
            'ひ': { char: '輝く者', desc: '光を放つ輝きを持つ。カリスマ性がある。', talents: ['表現力', 'カリスマ性', '影響力'], vowel: 'I' },
            'ふ': { char: '爽やか', desc: '爽やかな風のような存在。清涼感がある。', talents: ['爽やかさ', '清涼感', '自然体'], vowel: 'U' },
            'へ': { char: '方向指', desc: '明確な方向性を指し示す。目標設定が得意。', talents: ['方向感覚', '指向力', 'リーダーシップ'], vowel: 'E' },
            'ほ': { char: '温かさ', desc: '温かさと優しさで包む。受容的で寛大。', talents: ['温かさ', '優しさ', '包容力'], vowel: 'O' },
            'ま': { char: '統合者', desc: '全体を統合する円満性。バランスを取る。', talents: ['統合力', '循環感覚', 'バランス'], vowel: 'A' },
            'み': { char: '観察者', desc: '見る力と美的感覚。観察眼に優れる。', talents: ['観察眼', '洞察力', '美意識'], vowel: 'I' },
            'む': { char: '内省者', desc: '内に籠もって本質を探究。深い思考力。', talents: ['深思考', '内省力', '精神性'], vowel: 'U' },
            'め': { char: '指標者', desc: '目標と指標を示す。明確な基準を設定。', talents: ['指標力', '導き力', '明確さ'], vowel: 'E' },
            'も': { char: '維持者', desc: 'ものを保ち続ける力。維持管理に優れる。', talents: ['維持力', '保持力', '継続性'], vowel: 'O' },
            'や': { char: '到達者', desc: '矢が的に到達する達成力。確実に到達する。', talents: ['達成力', '的確さ', '集中力'], vowel: 'A' },
            'ゆ': { char: '柔軟者', desc: 'ゆらぎながら進む柔軟性。流動的で弾力性。', talents: ['柔軟性', '流動対応', '適応力'], vowel: 'U' },
            'よ': { char: '広がり', desc: '世界へと広がる拡大性。グローバルな視点。', talents: ['拡大性', '視野の広さ', '開放性'], vowel: 'O' },
            'ら': { char: 'ロジック', desc: '論理と理性で世界を読む。合理的判断。', talents: ['論理性', '分析力', '理性'], vowel: 'A' },
            'り': { char: '秩序者', desc: '秩序と整理を重視。体系化が得意。', talents: ['整理力', '組織力', '秩序感'], vowel: 'I' },
            'る': { char: '貴重者', desc: '瑠璃のような貴重さ。特別な価値を発揮。', talents: ['価値発揮', '稀少性', '個性'], vowel: 'U' },
            'れ': { char: '模範者', desc: '周囲の手本となる存在。模範的な行動。', talents: ['模範性', '信頼獲得', '誠実さ'], vowel: 'E' },
            'ろ': { char: '情熱家', desc: '炉のように情熱が燃える。熱血で一途。', talents: ['情熱', '熱血性', 'エネルギー'], vowel: 'O' },
            'わ': { char: '統合者', desc: '個を統合して輪を作る。融和性がある。', talents: ['統合力', '調和力', '融和性'], vowel: 'A' },
            'を': { char: '柔軟者', desc: '柔軟に流れに身を任せる。自然な流れ。', talents: ['柔軟性', '流動性', '適応力'], vowel: 'O' },

        const LIFE_PATH = {
            1: { type: 'リーダー型', theme: '開拓と独立', desc: '独立心旺盛な先駆者。新しい道を切り拓く。',
                 direction: '一人で切り拓く方向に才能が向かう',
                 boost: ['創造性', '行動力', 'リーダーシップ', '革新性', '決断力'],
                 tension: '孤立しやすい。チームより単独突破を選びがち',
                 shadow_add: '「自分でやった方が早い」と周囲を巻き込めなくなるかも' },

                 boost: ['適応力', '柔軟性', '変化対応', '好奇心', '開放性'],
                 tension: '一つのことへの集中が続かない。飽きやすい',

                 boost: ['洞察力', '分析力', '深思考', '内省力', '精神性'],
                 tension: '行動より思考が先になりすぎる。動き出しが遅い',

        function convertToSeion(char) {
            return SEION_MAP[char] || char;
        }

        function isVoiced(char) {
            return ['が','ぎ','ぐ','げ','ご','ざ','じ','ず','ぜ','ぞ','だ','ぢ','づ','で','ど','ば','び','ぶ','べ','ぼ'].includes(char);
        }

        function isBurst(char) {
            return ['ぱ','ぴ','ぷ','ぺ','ぽ'].includes(char);
        }

        function isYoon(str) {
            return YOON_MAP.hasOwnProperty(str);
        }

        // ============================================================================
        // UI制御
        // ============================================================================

        window.addEventListener('DOMContentLoaded', function() {
            initializeBirthYearOptions();
            initializeBirthDayOptions();

            // イベントリスナーはDOMContentLoaded内で登録
            document.getElementById('birthYear').addEventListener('change', updateDaysInMonth);
            document.getElementById('birthMonth').addEventListener('change', updateDaysInMonth);
        });

        function initializeBirthYearOptions() {
            const yearSelect = document.getElementById('birthYear');
            const currentYear = new Date().getFullYear();
            for (let year = currentYear; year >= 1900; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year + '年';
                if (year === 2000) option.selected = true;
                yearSelect.appendChild(option);
            }
        }

        function initializeBirthDayOptions() {
            const daySelect = document.getElementById('birthDay');
            for (let day = 1; day <= 31; day++) {
                const option = document.createElement('option');
                option.value = day;
                option.textContent = day + '日';
                if (day === 15) option.selected = true;
                daySelect.appendChild(option);
            }
        }

        function updateDaysInMonth() {
            const year = document.getElementById('birthYear').value;
            const month = document.getElementById('birthMonth').value;
            const daySelect = document.getElementById('birthDay');
            const currentValue = daySelect.value;

            if (!year || !month) return;

            const daysInMonth = new Date(year, month, 0).getDate();

            // プレースホルダー以外をクリア
            while (daySelect.options.length > 1) {
                daySelect.remove(1);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const option = document.createElement('option');
                option.value = day;
                option.textContent = day + '日';
                daySelect.appendChild(option);
            }

            // 以前の値を復元（範囲内なら）
            if (currentValue && parseInt(currentValue) <= daysInMonth) {
                daySelect.value = currentValue;
            }
        }

        function getBirthdate() {
            const year = document.getElementById('birthYear').value;
            const month = document.getElementById('birthMonth').value.padStart(2, '0');
            const day = document.getElementById('birthDay').value.padStart(2, '0');
            
            if (!year || !month || !day) return null;
            
            return `${year}-${month}-${day}`;
        }

        // ============================================================================
        // 解析関数
        // ============================================================================

        function parseWithYoon(text) {
            const sounds = [];
            let i = 0;
            
            while (i < text.length) {
                const char = text[i];
                
                if (char === 'っ' || char === 'ッ') {
                    sounds.push({ type: 'sokuon', nextBoost: 1.3 });
                    i++;
                    continue;
                }
                
                if (char === 'ー') {
                    if (sounds.length > 0) {
                        const lastSound = sounds[sounds.length - 1];
                        if (lastSound.type !== 'sokuon') {
                            lastSound.longVowel = true;
                            lastSound.weight = (lastSound.weight || 1.0) * 1.15;
                        }
                    }
                    i++;
                    continue;
                }
                
                const twoChar = text.substr(i, 2);
                if (isYoon(twoChar)) {
                    const yoonSound = generateYoonSound(twoChar);
                    if (yoonSound) sounds.push(yoonSound);
                    i += 2;
                    continue;
                }
                
                const seion = convertToSeion(char);
                const baseSound = KIGO_MASTER[seion];
                
                if (baseSound) {
                    sounds.push({
                        original: char,
                        seion: seion,
                        char: baseSound.char,
                        desc: baseSound.desc,
                        talents: baseSound.talents,
                        vowel: baseSound.vowel,
                        voiced: isVoiced(char),
                        burst: isBurst(char),
                        weight: 1.0
                    });
                }
                
                i++;
            }
            
            for (let j = 0; j < sounds.length - 1; j++) {
                if (sounds[j].type === 'sokuon' && sounds[j + 1].type !== 'sokuon') {
                    sounds[j + 1].weight = (sounds[j + 1].weight || 1.0) * sounds[j].nextBoost;
                    sounds[j + 1].sokuonBoosted = true;
                }
            }
            
            return sounds.filter(s => s.type !== 'sokuon');
        }

        function generateYoonSound(yoonChar) {
            const yoonInfo = YOON_MAP[yoonChar];
            if (!yoonInfo) return null;
            
            const baseSeion = convertToSeion(yoonInfo.base);
            const baseSound = KIGO_MASTER[baseSeion];
            const glideSeion = yoonInfo.glide;
            const glideSound = KIGO_MASTER[glideSeion];
            
            if (!baseSound || !glideSound) return null;
            
            const talents = [];
            if (baseSound.talents[0]) talents.push(baseSound.talents[0]);
            if (baseSound.talents[1]) talents.push(baseSound.talents[1]);
            if (glideSound.talents[0]) talents.push(glideSound.talents[0]);
            
            return {
                original: yoonChar,
                isYoon: true,
                main: baseSound,
                sub: glideSound,
                mainWeight: 0.8,
                subWeight: 0.2,
                char: baseSound.char + '（動的）',
                desc: `${baseSound.char}の性質と${glideSound.char}の広がりを持つ。`,
                talents: talents.slice(0, 3),
                vowel: glideSound.vowel,
                weight: 1.0
            };
        }

        function analyzeName(sei, mei) {
            const seiSounds = sei ? parseWithYoon(sei) : [];
            const meiSounds = mei ? parseWithYoon(mei) : [];
            
            if (meiSounds.length === 0) {
                throw new Error('名前（名）を入力してください');
            }
            
            const allSounds = [...seiSounds, ...meiSounds];
            const soundCount = {};
            const soundOccurrences = {};
            
            allSounds.forEach((sound, index) => {
                const key = sound.isYoon ? sound.original : (sound.original || sound.char);
                soundCount[key] = (soundCount[key] || 0) + 1;
                
                if (!soundOccurrences[key]) soundOccurrences[key] = [];
                soundOccurrences[key].push({ index: index, occurrence: soundCount[key], sound: sound });
            });
            
            const vowelCount = {};
            allSounds.forEach(s => {
                if (s.vowel) vowelCount[s.vowel] = (vowelCount[s.vowel] || 0) + 1;
            });
            
            const dominantVowel = Object.keys(vowelCount).length > 0
                ? Object.keys(vowelCount).reduce((a, b) => vowelCount[a] > vowelCount[b] ? a : b)
                : 'O';
            
            const weightedTalents = {};
            
            if (seiSounds.length > 0) {
                seiSounds.forEach((sound, index) => {
                    const key = sound.isYoon ? sound.original : (sound.original || sound.char);
                    const occurrence = soundOccurrences[key].findIndex(o => o.index === index) + 1;
                    const decayFactor = Math.pow(0.5, occurrence - 1);
                    const baseWeight = sound.weight || 1.0;
                    const weight = 0.3 * baseWeight * decayFactor;
                    
                    sound.talents.forEach(talent => {
                        weightedTalents[talent] = (weightedTalents[talent] || 0) + weight;
                    });
                });
                
                meiSounds.forEach((sound, index) => {
                    const key = sound.isYoon ? sound.original : (sound.original || sound.char);
                    const globalIndex = seiSounds.length + index;
                    const occurrence = soundOccurrences[key].findIndex(o => o.index === globalIndex) + 1;
                    const decayFactor = Math.pow(0.5, occurrence - 1);
                    const baseWeight = sound.weight || 1.0;
                    const weight = 0.7 * baseWeight * decayFactor;
                    
                    sound.talents.forEach(talent => {
                        weightedTalents[talent] = (weightedTalents[talent] || 0) + weight;
                    });
                });
            } else {
                const len = meiSounds.length;
                
                meiSounds.forEach((sound, index) => {
                    const key = sound.isYoon ? sound.original : (sound.original || sound.char);
                    const occurrence = soundOccurrences[key].findIndex(o => o.index === index) + 1;
                    const decayFactor = Math.pow(0.5, occurrence - 1);
                    const baseWeight = sound.weight || 1.0;
                    
                    let positionWeight;
                    if (index === 0) positionWeight = 0.5;
                    else if (index === len - 1) positionWeight = 0.3;
                    else positionWeight = 0.2 / Math.max(1, len - 2);
                    
                    const weight = positionWeight * baseWeight * decayFactor;
                    
                    sound.talents.forEach(talent => {
                        weightedTalents[talent] = (weightedTalents[talent] || 0) + weight;
                    });
                });
            }
            
            return {
                sei: seiSounds,
                mei: meiSounds,
                allSounds: allSounds,
                soundCount: soundCount,
                soundOccurrences: soundOccurrences,
                vowelCount: vowelCount,
                dominantVowel: dominantVowel,
                weightedTalents: weightedTalents,
                hasNoSei: seiSounds.length === 0
            };
        }

        function calculateLifePath(birthdate) {
            const digits = birthdate.replace(/-/g, '').split('').map(Number);
            let sum = digits.reduce((a, b) => a + b, 0);
            while (sum > 9) {
                sum = String(sum).split('').map(Number).reduce((a, b) => a + b, 0);
            }
            return sum;
        }

            // 才能名で直接引く（同じ内容が出る問題を解決）
            if (TALENT_SHADOW[talent]) {
                return { talent: talent, data: TALENT_SHADOW[talent] };
            }
            // フォールバック：音経由
            const allSounds = nameAnalysis.allSounds;
            for (const sound of allSounds) {
                const seion = sound.seion || sound.original;
                if (seion && SHADOW_DATA[seion] && sound.talents && sound.talents.includes(talent)) {
                    const sd = SHADOW_DATA[seion];
                    return { talent: talent, data: {
                        source: sd.core,
                        mechanism: sd.scene,
                        voice: '...',
                        risk: (sd.cost || '').replace('かも', '')
                    }};
                }
            }
            return null;
        }

            topTalents.forEach((talent) => {

                if (mapping) {
                    const action = mapping.action;
                    const careers = mapping.careers[gender];
                    
                    // 重複していない職種を選択
                    for (const career of careers) {
                        if (!usedCareers.has(career)) {
                            rolesList.push(`${action}：${career}のように`);
                            usedCareers.add(career);
                            break;
                        }
                    }
                }
            });
            
            // 3つ揃わない場合、デフォルト職種を追加
            if (rolesList.length < 3) {

                    '自分の強みを活かして働く：スペシャリストのように',
                    '人と協力して成果を出す：チームメンバーのように',
                    '新しい挑戦を続ける：チャレンジャーのように'
                ];
                
                defaultRoles.forEach(role => {
                    if (rolesList.length < 3) {
                        rolesList.push(role);
                    }
                });
            }
            
            return rolesList.slice(0, 3).map(r => '・' + r).join('<br>');
        }

                return '新しい可能性を見出し、形にする力を持つ本質。未開の領域に踏み込み、価値を生み出します。';

                return '異なる要素を調和させ、全体を整える本質。多様性をまとめ、より大きな価値を創出します。';

                return '調和と統合を重視する環境。多様な価値観を受け入れ、全体の調和を保つことが求められます。';
            } else if (talents.includes('自由性') || talents.includes('開放性')) {
                return '自由と創造性を尊重する環境。束縛を嫌い、のびのびと個性を発揮することが推奨されます。';
            } else if (talents.includes('安定性') || talents.includes('堅実性')) {
                return '安定と継続を大切にする環境。着実な積み重ねと、信頼関係の構築が評価されます。';
            } else if (talents.includes('革新性') || talents.includes('変化対応')) {
                return '変化と革新を歓迎する環境。新しい挑戦が奨励され、柔軟な対応が求められます。';
            } else {
                return 'これらの特性が織りなす独自の環境。あなたの主体性を調整し、方向づける力として働きます。';
            }
        }

        /**
         * v4.1: 名前が示す本質（音由来は非表示）
         */
        function generateNameEssence(nameAnalysis, name) {
            const topTalents = Object.entries(nameAnalysis.weightedTalents)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5)
                .map(([talent]) => talent);

            const fullName = [name.sei, name.mei].filter(Boolean).join('　');

            // 才能グループから本質タイプを判定
            const creativeGroup = ['創造性', '行動力', 'リーダーシップ', '革新性', '開放性', '表現力'];
            const analyticalGroup = ['分析力', '論理性', '洞察力', '判断力', '決断力', '客観性'];
            const harmonyGroup = ['思いやり', '調和性', '包容力', '共感力', '調整力', 'サポート力'];
            const steadyGroup = ['責任感', '安定性', '実行力', '堅実性', '継続力', '信頼性'];

            const scores = {
                creative: topTalents.filter(t => creativeGroup.includes(t)).length,
                analytical: topTalents.filter(t => analyticalGroup.includes(t)).length,
                harmony: topTalents.filter(t => harmonyGroup.includes(t)).length,
                steady: topTalents.filter(t => steadyGroup.includes(t)).length,
            };
            const dominant = Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];

            const essenceMap = {
                creative: `「${fullName}」という名前は、新しいものを生み出し、道を切り拓く力を持つ本質を示しています。可能性を形にする力が、名前に刻まれています。`,
                analytical: `「${fullName}」という名前は、物事の本質を見抜き、的確に判断する力を持つ本質を示しています。複雑さの中に秩序を見出す力が、名前に刻まれています。`,
                harmony: `「${fullName}」という名前は、人と人をつなぎ、場を整える力を持つ本質を示しています。関係性を育て、調和を生む力が、名前に刻まれています。`,
                steady: `「${fullName}」という名前は、着実に積み上げ、最後まで責任を持ってやり遂げる力を持つ本質を示しています。信頼を積み重ねる力が、名前に刻まれています。`,
            };

            const talentText = topTalents.slice(0, 3).join('・');

            return `
                <p style="line-height: 1.9; padding: 20px; background: rgba(212, 175, 55, 0.1); border-left: 4px solid var(--gold); border-radius: 5px; margin-bottom: 20px;">
                    ${essenceMap[dominant]}
                </p>
                <p style="line-height: 1.9;">
                    <strong class="text-gold">名前が示す主要な才能：</strong><br>
                    ${talentText}
                </p>
            `;
        }

        /**
         * v4.1: 生年月日が示すテーマ（個別解説なし・才能との統合のみ）
         */
        function generateLifeTheme(diagnosis) {
            const lp = LIFE_PATH[diagnosis.lifePath];
            const bt = BLOOD_TYPE[diagnosis.bloodType];
            const topTalents = Object.entries(diagnosis.nameAnalysis.weightedTalents)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 3)
                .map(([talent]) => talent);
            const talent1 = topTalents[0];

            const isBoost = lp.boost.some(b => topTalents.includes(b));
            const boostText = isBoost
                ? `「${lp.theme}」というテーマが、あなたの「${talent1}」をさらに強く後押ししています。`
                : `「${lp.theme}」というテーマは、あなたの「${talent1}」と時に摩擦を生みます。でも、そのぶつかり合いがあなたを深くします。`;

            return `
                <p style="line-height: 1.9; margin-bottom: 15px;">
                    <strong class="text-gold">人生のテーマ：${lp.theme}（${lp.type}）</strong><br><br>
                    ${boostText}
                </p>
                <p style="line-height: 1.9; padding: 15px; background: rgba(220, 20, 60, 0.08); border-left: 4px solid var(--red); border-radius: 5px;">
                    ${lp.shadow_add}
                </p>
            `;
        }
    </script>
