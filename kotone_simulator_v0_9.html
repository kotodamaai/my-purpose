<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOTONE Simulator v0.9 - AI診断文生成</title>
<style>
  /* ========================================
     KOTONE Simulator - 検証用シミュレーター
     L1機能辞書 v1.2 / 数秘 v1.0
     L2プロセス生成ルール v1.0
     統合ロジック v1.0
     ダイヤ式数秘術 v2.0(B案:全桁参考表示)
  ======================================== */

  :root {
    --bg: #f4f1ea;
    --bg-panel: #fafaf6;
    --bg-card: #ffffff;
    --ink: #1a1a1a;
    --ink-2: #4a4a4a;
    --ink-3: #8a8a8a;
    --line: #d8d2c5;
    --accent: #b8593a;       /* 朱 */
    --accent-2: #2c4a52;     /* 紺 */
    --accent-3: #8a7c4f;     /* 黄土 */
    --common: #4a7a4a;       /* 緑(強化) */
    --conflict: #b8593a;     /* 朱(矛盾) */
    --complex: #6a4a8a;      /* 紫(干渉) */
    --tension: #c08a3a;      /* 山吹(張力) */
    --aux: #6a6a6a;          /* 灰(補助) */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Hiragino Mincho ProN", "YuMincho", "Yu Mincho", serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    padding: 32px 16px 80px;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
  }

  /* ヘッダー */
  header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
    margin-bottom: 32px;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .subtitle {
    font-size: 13px;
    color: var(--ink-3);
    margin-top: 4px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.02em;
  }

  /* 入力フォーム */
  .input-panel {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    padding: 24px;
    margin-bottom: 32px;
  }

  .input-row {
    display: grid;
    grid-template-columns: 1.2fr 1.2fr 1fr 0.8fr 0.8fr auto;
    gap: 14px;
    align-items: end;
  }

  @media (max-width: 720px) {
    .input-row { grid-template-columns: 1fr 1fr; }
  }

  .field label {
    display: block;
    font-size: 11px;
    color: var(--ink-3);
    margin-bottom: 4px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .field input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    background: var(--bg-card);
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
  }

  .field input:focus {
    outline: none;
    border-color: var(--accent-2);
  }

  button {
    padding: 10px 24px;
    background: var(--ink);
    color: var(--bg);
    border: none;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.1em;
  }

  button:hover { background: var(--accent-2); }

  .preset-row {
    margin-top: 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .preset-label {
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.1em;
  }

  .preset {
    padding: 4px 10px;
    background: transparent;
    color: var(--ink-2);
    border: 1px solid var(--line);
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0;
  }

  .preset:hover { border-color: var(--ink); background: var(--bg-card); }

  /* 出力エリア */
  .output { display: none; }
  .output.active { display: block; }

  .layer {
    margin-bottom: 32px;
    background: var(--bg-card);
    border: 1px solid var(--line);
  }

  .layer-header {
    background: var(--ink);
    color: var(--bg);
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    letter-spacing: 0.1em;
  }

  .layer-header .badge {
    font-family: "SF Mono", monospace;
    font-size: 10px;
    opacity: 0.7;
  }

  .layer-body { padding: 20px 24px; }

  .layer h2 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }

  .layer h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
    margin-top: 16px;
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }

  /* 数秘の計算表示 */
  .calc-box {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    background: var(--bg-panel);
    padding: 12px 16px;
    border-left: 3px solid var(--accent-2);
    font-size: 13px;
    margin-bottom: 12px;
    white-space: pre-wrap;
  }

  .calc-box.reference {
    border-left-color: var(--ink-3);
    color: var(--ink-2);
    font-style: italic;
  }

  /* 機能タグの表示 */
  .feature-grid {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 8px 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    margin-bottom: 8px;
  }

  .feature-grid .key {
    color: var(--ink-3);
    text-align: right;
  }

  .feature-grid .val {
    color: var(--ink);
  }

  /* チップ */
  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .chip {
    display: inline-block;
    padding: 2px 8px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--ink);
  }

  .chip.direction { border-color: var(--accent-2); color: var(--accent-2); }
  .chip.motion { border-color: var(--ink); color: var(--ink); }
  .chip.modifier { border-color: var(--accent-3); color: var(--accent-3); }
  .chip.tag { background: var(--accent-2); color: white; border-color: var(--accent-2); }
  .chip.weight { background: var(--accent); color: white; border-color: var(--accent); }

  /* プロセス矢印 */
  .process-flow {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 14px;
    background: var(--bg-panel);
    padding: 12px 16px;
    border-left: 3px solid var(--ink);
    margin: 8px 0;
  }

  /* intersection カテゴリ */
  .intersection-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 720px) {
    .intersection-grid { grid-template-columns: 1fr; }
  }

  .intersection-card {
    border: 1px solid var(--line);
    padding: 12px 16px;
    background: var(--bg-panel);
  }

  .intersection-card .label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 6px;
  }

  .intersection-card.common { border-left: 4px solid var(--common); }
  .intersection-card.conflict { border-left: 4px solid var(--conflict); }
  .intersection-card.complex { border-left: 4px solid var(--complex); }
  .intersection-card.tension { border-left: 4px solid var(--tension); }
  .intersection-card.auxiliary { border-left: 4px solid var(--aux); }

  .intersection-card.common .label { color: var(--common); }
  .intersection-card.conflict .label { color: var(--conflict); }
  .intersection-card.complex .label { color: var(--complex); }
  .intersection-card.tension .label { color: var(--tension); }
  .intersection-card.auxiliary .label { color: var(--aux); }

  .intersection-card .item {
    font-size: 13px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    margin: 4px 0;
    color: var(--ink-2);
  }

  .intersection-card .empty {
    font-size: 12px;
    color: var(--ink-3);
    font-style: italic;
  }

  /* 二系統比較レイアウト */
  .duo {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  @media (max-width: 720px) {
    .duo { grid-template-columns: 1fr; }
  }

  .duo .system {
    padding: 14px 16px;
    border: 1px solid var(--line);
    background: var(--bg-panel);
  }

  .duo .system .system-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--ink-3);
    text-transform: uppercase;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
  }

  /* JSON view */
  details {
    margin-top: 16px;
    border: 1px solid var(--line);
    padding: 8px 16px;
    background: var(--bg-panel);
  }

  details summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--ink-2);
    letter-spacing: 0.05em;
    padding: 4px 0;
  }

  details pre {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--ink-2);
    margin-top: 8px;
    padding: 12px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    overflow-x: auto;
    line-height: 1.5;
  }

  /* メタ情報 */
  .meta-info {
    font-size: 11px;
    color: var(--ink-3);
    font-family: "SF Mono", Menlo, Consolas, monospace;
    margin-top: 4px;
  }

  /* エラー */
  .error {
    background: #ffe6e0;
    border: 1px solid var(--conflict);
    color: var(--conflict);
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 13px;
  }

  /* L3 表現層 */
  .l3-final {
    background: linear-gradient(180deg, #fefcf6 0%, #faf6ec 100%);
    border: 1px solid var(--accent-3);
    padding: 32px 40px;
    margin-bottom: 32px;
    font-family: "Hiragino Mincho ProN", "YuMincho", "Yu Mincho", serif;
  }

  .l3-final .l3-header {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--accent-3);
  }

  .l3-final .l3-header .label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--accent-3);
    margin-bottom: 4px;
  }

  .l3-final .l3-header .title {
    font-size: 22px;
    color: var(--ink);
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  .l3-section {
    margin-bottom: 28px;
  }

  .l3-section:last-child {
    margin-bottom: 0;
  }

  .l3-section .section-title {
    display: inline-block;
    font-size: 13px;
    color: var(--accent-2);
    border-bottom: 2px solid var(--accent-3);
    padding-bottom: 2px;
    margin-bottom: 12px;
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  .l3-section p {
    font-size: 15px;
    line-height: 1.95;
    color: var(--ink);
    margin-bottom: 8px;
    text-align: justify;
  }

  .l3-section p:last-child {
    margin-bottom: 0;
  }

  .l3-catch {
    text-align: center;
    margin: 32px 0 0;
    padding: 20px;
    background: var(--bg-card);
    border: 1px dashed var(--accent-3);
  }

  .l3-catch .catch-label {
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.15em;
    margin-bottom: 8px;
  }

  .l3-catch .catch-text {
    font-size: 18px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.05em;
    line-height: 1.6;
  }

  .l3-catch .catch-note {
    font-size: 10px;
    color: var(--ink-3);
    margin-top: 8px;
    font-style: italic;
  }


  .l3-ai-section { margin-bottom:28px; }
  .l3-ai-section .section-title { display:inline-block; font-size:13px; color:var(--accent-2); border-bottom:2px solid var(--accent-3); padding-bottom:2px; margin-bottom:12px; letter-spacing:0.05em; font-weight:600; }
  .model-badge { display:inline-block; font-size:9px; font-family:"SF Mono",monospace; background:var(--accent-2); color:#fff; padding:1px 5px; margin-left:6px; letter-spacing:0.05em; vertical-align:middle; }
  .l3-ai-section p { font-size:15px; line-height:2.0; color:var(--ink); margin-bottom:8px; text-align:justify; white-space:pre-wrap; }
  .l3-loading { font-size:13px; color:var(--ink-3); font-style:italic; padding:8px 0; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1.0} }
  .l3-check-badge { display:inline-block; font-size:9px; font-family:"SF Mono",monospace; padding:1px 5px; margin-left:6px; vertical-align:middle; }
  .l3-check-badge.ok { background:#4a7a4a; color:#fff; }
  .l3-check-badge.retry { background:var(--accent); color:#fff; }
  /* フッター */
  footer {
    margin-top: 64px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--ink-3);
    font-family: "SF Mono", monospace;
    text-align: center;
    letter-spacing: 0.05em;
  }

  .note {
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 6px;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>KOTONE Simulator</h1>
    <div class="subtitle">v0.9 / Cloudflare Proxy · Haiku/Sonnet AI生成</div>
  </header>

  <div class="input-panel">
    <div class="input-row">
      <div class="field">
        <label>苗字(ひらがな)</label>
        <input type="text" id="lastName" placeholder="例:しょうだ">
      </div>
      <div class="field">
        <label>名前(ひらがな)</label>
        <input type="text" id="firstName" placeholder="例:みつし">
      </div>
      <div class="field">
        <label>年</label>
        <input type="number" id="year" placeholder="1996">
      </div>
      <div class="field">
        <label>月</label>
        <input type="number" id="month" placeholder="10" min="1" max="12">
      </div>
      <div class="field">
        <label>日</label>
        <input type="number" id="day" placeholder="19" min="1" max="31">
      </div>
      <div class="field">
        <button id="run">実行</button>
      </div>
    </div>
    <div class="preset-row">
      <span class="preset-label">PRESET</span>
      <button class="preset" data-ln="しょうだ" data-fn="みつし" data-y="1980" data-m="3" data-d="15">しょうだ みつし</button>
      <button class="preset" data-ln="いのうえ" data-fn="しげき" data-y="1975" data-m="7" data-d="22">いのうえ しげき</button>
      <button class="preset" data-ln="おおの" data-fn="えりこ" data-y="1996" data-m="10" data-d="19">おおの えりこ</button>
      <button class="preset" data-ln="" data-fn="" data-y="1996" data-m="11" data-d="19">11月19日(誕生日のみ)</button>
      <button class="preset" data-ln="" data-fn="" data-y="1990" data-m="3" data-d="7">3月7日</button>
      <button class="preset" data-ln="" data-fn="" data-y="1990" data-m="5" data-d="15">5月15日</button>
    </div>
  </div>

  <div id="error-box"></div>
  <div id="output" class="output"></div>

  <footer>
    KOTONE Simulator v0.9 · Cloudflare Workers プロキシ経由 · Haiku/Sonnet AI生成
  </footer>
</div>

<script>
/* ============================================================
   1. L1機能辞書(言霊・抜粋実装版)
   ※v1.2正本のうち、検証に必要なコア音のみ実装
   ============================================================ */

// 音 → {direction, motion[], modifier[]}
// 言霊L1辞書 v1.2 のJSON正本に基づく
const KOTODAMA_L1 = {
  // あ行
  "あ": { direction: "外向", motion: ["起点", "拡散"], modifier: [] },
  "い": { direction: "内向", motion: ["収束"], modifier: [] },
  "う": { direction: "内向", motion: ["保持"], modifier: ["蓄積"] },
  "え": { direction: "双方向", motion: ["接続"], modifier: ["媒介"] },
  "お": { direction: "中立", motion: ["収束", "保持"], modifier: [] },
  // か行(切断)
  "か": { direction: "外向", motion: ["起点", "切断"], modifier: [] },
  "き": { direction: "外向", motion: ["切断", "収束"], modifier: [] },
  "く": { direction: "内向", motion: ["切断", "保持"], modifier: ["蓄積"] },
  "け": { direction: "双方向", motion: ["切断", "接続"], modifier: ["媒介"] },
  "こ": { direction: "中立", motion: ["切断", "収束", "保持"], modifier: [] },
  // さ行(接続+反復)
  "さ": { direction: "外向", motion: ["接続", "起点"], modifier: ["反復"] },
  "し": { direction: "内向", motion: ["接続", "収束"], modifier: ["反復"] },
  "す": { direction: "内向", motion: ["接続", "保持"], modifier: ["反復", "蓄積"] },
  "せ": { direction: "双方向", motion: ["接続"], modifier: ["反復", "媒介"] },
  "そ": { direction: "中立", motion: ["接続", "収束", "保持"], modifier: ["反復"] },
  // た行(切断+保持)
  "た": { direction: "外向", motion: ["起点", "切断", "保持"], modifier: [] },
  "ち": { direction: "外向", motion: ["切断", "収束", "保持"], modifier: [] },
  "つ": { direction: "内向", motion: ["切断", "保持"], modifier: ["蓄積"] },
  "て": { direction: "双方向", motion: ["切断", "接続", "保持"], modifier: ["媒介"] },
  "と": { direction: "中立", motion: ["切断", "収束", "保持"], modifier: [] },
  // な行(接続+持続)
  "な": { direction: "外向", motion: ["接続", "起点"], modifier: ["持続"] },
  "に": { direction: "内向", motion: ["接続", "収束"], modifier: ["持続"] },
  "ぬ": { direction: "内向", motion: ["接続", "保持"], modifier: ["持続", "蓄積"] },
  "ね": { direction: "双方向", motion: ["接続"], modifier: ["持続", "媒介"] },
  "の": { direction: "中立", motion: ["接続", "収束", "保持"], modifier: ["持続"] },
  // は行(拡散)
  "は": { direction: "外向", motion: ["拡散", "起点"], modifier: [] },
  "ひ": { direction: "外向", motion: ["拡散", "収束"], modifier: [] },
  "ふ": { direction: "内向", motion: ["拡散", "保持"], modifier: ["蓄積"] },
  "へ": { direction: "双方向", motion: ["拡散", "接続"], modifier: ["媒介"] },
  "ほ": { direction: "中立", motion: ["拡散", "収束", "保持"], modifier: [] },
  // ま行(保持)
  "ま": { direction: "外向", motion: ["保持", "起点"], modifier: [] },
  "み": { direction: "外向", motion: ["保持", "収束"], modifier: [] },
  "む": { direction: "内向", motion: ["保持"], modifier: ["蓄積"] },
  "め": { direction: "双方向", motion: ["保持", "接続"], modifier: ["媒介"] },
  "も": { direction: "中立", motion: ["保持", "収束"], modifier: [] },
  // や行(接続)
  "や": { direction: "外向", motion: ["接続", "起点"], modifier: [] },
  "ゆ": { direction: "内向", motion: ["接続", "保持"], modifier: ["蓄積"] },
  "よ": { direction: "中立", motion: ["接続", "収束", "保持"], modifier: [] },
  // ら行(拡散+反復)
  "ら": { direction: "外向", motion: ["拡散", "起点"], modifier: ["反復"] },
  "り": { direction: "外向", motion: ["拡散", "収束"], modifier: ["反復"] },
  "る": { direction: "内向", motion: ["拡散", "保持"], modifier: ["反復", "蓄積"] },
  "れ": { direction: "双方向", motion: ["拡散", "接続"], modifier: ["反復", "媒介"] },
  "ろ": { direction: "中立", motion: ["拡散", "収束", "保持"], modifier: ["反復"] },
  // わ行(接続+媒介)
  "わ": { direction: "外向", motion: ["接続", "起点"], modifier: ["媒介"] },
  "を": { direction: "中立", motion: [], modifier: [] }, // 機能音
  "ん": { direction: "内向シフト", motion: [], modifier: [] }, // 機能音(内向シフト)
};

// 濁音→清音マップ
const DAKUON_MAP = {
  "が":"か","ぎ":"き","ぐ":"く","げ":"け","ご":"こ",
  "ざ":"さ","じ":"し","ず":"す","ぜ":"せ","ぞ":"そ",
  "だ":"た","ぢ":"ち","づ":"つ","で":"て","ど":"と",
  "ば":"は","び":"ひ","ぶ":"ふ","べ":"へ","ぼ":"ほ",
  "ぱ":"は","ぴ":"ひ","ぷ":"ふ","ぺ":"へ","ぽ":"ほ",
};

/* ============================================================
   2. L1機能辞書(数秘 v1.0)
   ============================================================ */

const NUMEROLOGY_L1 = {
  "1":  { meta: {気質:"陽",   役割:"リーダー",       成長:"子ども"}, direction: "外向",   motion: ["起点", "切断"],         modifier: ["瞬発"] },

/* ============================================================
   3. 数秘計算(ダイヤ式 v2.0)
   ============================================================ */

function computeDay(day) {
  // 2桁の場合:組み合わせ + 収束値
  // 1桁の場合:そのまま
  const result = { primary: [], converged: null, isPair: false };

  if (day < 10) {
    result.primary = [String(day)];
  } else {
    const tens = Math.floor(day / 10);
    const ones = day % 10;
    if (ones === 0) {
      // 10, 20, 30 → 1桁化(0は増幅器)
      result.primary = [String(tens)];
      result.amplified = true;
    } else {
      result.primary = [String(tens), String(ones)];
      result.isPair = true;
      let sum = tens + ones;
      // マスター数チェック(11/22)
      if (sum === 11 || sum === 22) {
        result.converged = String(sum);
      } else if (sum >= 10) {
        sum = Math.floor(sum / 10) + (sum % 10);
        result.converged = String(sum);
      } else {
        result.converged = String(sum);
      }
    }
  }
  return result;
}

function computeMonth(month) {
  // 1桁化、ただし11はマスター数として保持
  if (month === 11) return { value: "11", isMaster: true };
  if (month < 10) return { value: String(month), isMaster: false };
  // 12月 → 1+2=3
  const sum = Math.floor(month / 10) + (month % 10);
  return { value: String(sum), isMaster: false, amplified: month === 10 || month === 20 };
}

function computeFullSum(year, month, day) {
  // 全桁合計(参考表示・v3.0以降の上級診断)
  const digits = String(year) + String(month) + String(day);
  let sum = 0;
  for (const ch of digits) sum += parseInt(ch);
  const trace = [sum];
  while (sum >= 10 && sum !== 11 && sum !== 22 && sum !== 33) {
    let next = 0;
    for (const ch of String(sum)) next += parseInt(ch);
    sum = next;
    trace.push(sum);
  }
  return { final: String(sum), trace };
}

/* ============================================================
   4. L1機能タグ取得 + 重複減衰
   ============================================================ */

// ひらがな1名前を「音単位」に分解(拗音は基音80%+グライド20%)
// 戻り値:[{ch: "し", weight: 0.8}, {ch: "よ", weight: 0.2}, ...]
function decomposeSounds(name) {
  const result = [];
  for (let i = 0; i < name.length; i++) {
    let ch = name[i];
    const next = name[i + 1];
    
    // 拗音処理(基音80% + グライド20%)
    // 小文字「ゃゅょ」+ 母音小文字「ぁぃぅぇぉ」をグライド音として扱う
    if (next && "ゃゅょぁぃぅぇぉ".includes(next)) {
      // 基音(濁音→清音変換は後で適用)
      let baseChar = DAKUON_MAP[ch] || ch;
      result.push({ ch: baseChar, weight: 0.8 });
      
      // グライド音(小文字を大文字相当へ変換)
      const glideMap = {
        "ゃ": "や", "ゅ": "ゆ", "ょ": "よ",
        "ぁ": "あ", "ぃ": "い", "ぅ": "う", "ぇ": "え", "ぉ": "お"
      };
      const glideChar = glideMap[next];
      if (glideChar) {
        result.push({ ch: glideChar, weight: 0.2 });
      }
      i++; // 次の文字をスキップ
      continue;
    }
    
    // 促音・長音はスキップ(暫定)
    if (ch === "っ" || ch === "ー") continue;
    
    // 濁音→清音
    if (DAKUON_MAP[ch]) ch = DAKUON_MAP[ch];
    
    result.push({ ch, weight: 1.0 });
  }
  return result;
}

// 音列(decomposeSounds結果)からL1機能タグを集計
function getKotodamaL1(name) {
  if (!name) return null;
  
  const sounds = decomposeSounds(name);
  
  // 重複減衰(50%, 25%, 12.5%)を適用しつつ集計
  const counter = {};
  const features = {
    direction: { 外向: 0, 内向: 0, 双方向: 0, 中立: 0 },
    motion: {},
    modifier: {}
  };
  
  for (const { ch, weight } of sounds) {
    const def = KOTODAMA_L1[ch];
    if (!def) continue;
    counter[ch] = (counter[ch] || 0) + 1;
    // 1回目1.0、2回目0.5、3回目0.25...
    const decay = Math.pow(0.5, counter[ch] - 1);
    // 拗音グライドは weight=0.2 を反映
    const w = decay * weight;
    
    // 「ん」は内向シフト(direction を内向側に寄せる触媒)
    if (def.direction === "内向シフト") {
      features.direction.内向 += 0.3 * w;
      continue;
    }
    if (features.direction[def.direction] !== undefined) {
      features.direction[def.direction] += w;
    }
    for (const m of def.motion) {
      features.motion[m] = (features.motion[m] || 0) + w;
    }
    for (const mod of def.modifier) {
      features.modifier[mod] = (features.modifier[mod] || 0) + w;
    }
  }
  
  // 集計結果から代表値を抽出
  const direction = Object.entries(features.direction)
    .sort((a,b) => b[1] - a[1])[0]?.[0] || "中立";
  
  // 動き:0.5以上を採用、最初の出現順で並べる
  const motionOrdered = [];
  const motionSeen = new Set();
  for (const { ch } of sounds) {
    const def = KOTODAMA_L1[ch];
    if (!def) continue;
    for (const m of def.motion) {
      if (!motionSeen.has(m) && (features.motion[m] || 0) >= 0.5) {
        motionSeen.add(m);
        motionOrdered.push(m);
      }
    }
  }
  
  // 修飾:0.5以上を採用
  const modifierList = Object.entries(features.modifier)
    .filter(([_, v]) => v >= 0.5)
    .map(([k, _]) => k);
  
  return {
    sounds: sounds.map(s => s.ch),  // L3で使うため文字列のみのリストも返す
    sounds_with_weight: sounds,      // 詳細
    direction,
    motion: motionOrdered,
    modifier: modifierList,
    raw_scores: features
  };
}

function getNumerologyL1(year, month, day) {
  const dayResult = computeDay(day);
  const monthResult = computeMonth(month);
  const fullSum = computeFullSum(year, month, day);

  // 出現する数字を収集(重複カウント)
  const appearances = {};
  for (const n of dayResult.primary) {
    appearances[n] = (appearances[n] || 0) + 1;
  }
  // 月の数字も追加(マスター数なら2と4の性質も持つが、ここでは表記通りに)
  appearances[monthResult.value] = (appearances[monthResult.value] || 0) + 1;
  // 収束値があれば(注意:重複強調にはカウントしない・参考扱い)

  // 各数字をL1機能化
  const numbers = {};
  for (const num of Object.keys(appearances)) {
    const def = NUMEROLOGY_L1[num];
    if (!def) continue;
    numbers[num] = {
      ...def,
      weight: appearances[num] // 線形×軸数(統合ロジックv1.0)
    };
  }

  return {
    day: dayResult,
    month: monthResult,
    fullSum, // 参考表示用
    appearances,
    numbers
  };
}

/* ============================================================
   5. L2プロセス生成(v1.0)
   ============================================================ */

const NATURAL_ORDER = ["起点", "拡散", "収束", "接続", "切断", "保持"];

function needsCorrection(motionList) {
  if (!motionList.length) return false;
  const head = motionList[0];
  const rest = motionList.slice(1);
  if (head === "保持" && rest.includes("起点")) return true;
  if (head === "切断" && (rest.includes("拡散") || rest.includes("収束"))) return true;
  return false;
}

function orderMotion(motionList) {
  const ordered = [...motionList];
  if (needsCorrection(ordered)) {
    return ordered.sort((a, b) => NATURAL_ORDER.indexOf(a) - NATURAL_ORDER.indexOf(b));
  }
  return ordered;
}

function buildL2WithTags(L1) {
  const process = orderMotion(L1.motion);
  const tags = [];
  if (process.includes("接続")) {
    for (const mod of L1.modifier) {
      tags.push(`接続_${mod}`);
    }
  }
  return {
    process,
    direction: L1.direction,
    modifier: L1.modifier,
    tags
  };
}

/* ============================================================
   6. 交差判定(統合ロジック v1.0)
   ============================================================ */

function classifyDirectionPair(k_dir, n_dir) {
  if (k_dir === n_dir) {
    return { category: "common", payload: `${k_dir}(×1.5)` };
  }
  const inclusion = new Set([
    "双方向|外向", "外向|双方向",
    "双方向|内向", "内向|双方向",
  ]);
  if (inclusion.has(`${k_dir}|${n_dir}`)) {
    return {
      category: "complex",
      payload: { axis: "方向", kotodama: k_dir, numerology: n_dir, relation: "包含" }
    };
  }
  const dynamic = new Set(["外向", "内向", "双方向"]);
  if ((k_dir === "中立" && dynamic.has(n_dir)) ||
      (n_dir === "中立" && dynamic.has(k_dir))) {
    return {
      category: "complex",
      payload: { axis: "方向", kotodama: k_dir, numerology: n_dir, relation: "動的×静的" }
    };
  }
  if ((k_dir === "外向" && n_dir === "内向") ||
      (k_dir === "内向" && n_dir === "外向")) {
    return {
      category: "conflict",
      payload: { axis: "方向", kotodama: k_dir, numerology: n_dir, type: "(三分類で判定)" }
    };
  }
  return null;
}

function classifyMotionConflict(k_motion, n_motion, k_mod, n_mod) {
  const conflicts = [];
  const pairs = [
    ["拡散", "収束"],
    ["接続", "切断"],
    ["起点", "保持"],
  ];
  for (const [a, b] of pairs) {
    const k_has_a = k_motion.includes(a);
    const k_has_b = k_motion.includes(b);
    const n_has_a = n_motion.includes(a);
    const n_has_b = n_motion.includes(b);

    let k_val, n_val;
    if (k_has_a && n_has_b && !k_has_b && !n_has_a) { k_val = a; n_val = b; }
    else if (k_has_b && n_has_a && !k_has_a && !n_has_b) { k_val = b; n_val = a; }
    else continue;

    // 三分類判定
    let type;
    // タイプ①:時間分離(両方がprocess上にある = 既に成立)
    if ((k_motion.includes(k_val) && n_motion.includes(n_val))) {
      type = "時間分離";
    } else {
      // タイプ②/③(動きの場合は時間分離が基本、それ以外は同時衝突)
      type = "時間分離";
    }
    conflicts.push({ axis: "動き", kotodama: k_val, numerology: n_val, type });
  }
  return conflicts;
}

function detectTempoTension(k_mod, n_mod) {
  const pairs = [["瞬発", "持続"], ["瞬発", "蓄積"]];
  const result = [];
  const k_set = new Set(k_mod);
  const n_set = new Set(n_mod);
  for (const [a, b] of pairs) {
    if (k_set.has(a) && n_set.has(b)) {
      result.push({ kotodama: a, numerology: b });
    } else if (k_set.has(b) && n_set.has(a)) {
      result.push({ kotodama: b, numerology: a });
    }
  }
  return result;
}

function buildIntersection(k_L2, n_L2) {
  const common = [];
  const conflict = [];
  const complex = [];
  const modifier_conflict = [];
  const auxiliary = { kotodama_only: [], numerology_only: [] };

  // 方向
  const dirResult = classifyDirectionPair(k_L2.direction, n_L2.direction);
  if (dirResult) {
    if (dirResult.category === "common") common.push(dirResult.payload);
    else if (dirResult.category === "complex") complex.push(dirResult.payload);
    else if (dirResult.category === "conflict") conflict.push(dirResult.payload);
  }

  // 動きの共通
  const k_motion_set = new Set(k_L2.process);
  const n_motion_set = new Set(n_L2.process);
  for (const m of k_motion_set) {
    if (n_motion_set.has(m)) common.push(`${m}(×1.5)`);
  }

  // 動きの矛盾
  const motionConflicts = classifyMotionConflict(
    k_L2.process, n_L2.process, k_L2.modifier, n_L2.modifier
  );
  conflict.push(...motionConflicts);

  // テンポ張力
  modifier_conflict.push(...detectTempoTension(k_L2.modifier, n_L2.modifier));

  // 補助(片側のみの動き)
  const conflictMotions = new Set();
  for (const c of motionConflicts) {
    conflictMotions.add(c.kotodama);
    conflictMotions.add(c.numerology);
  }
  for (const m of k_motion_set) {
    if (!n_motion_set.has(m) && !conflictMotions.has(m)) {
      auxiliary.kotodama_only.push(m);
    }
  }
  for (const m of n_motion_set) {
    if (!k_motion_set.has(m) && !conflictMotions.has(m)) {
      auxiliary.numerology_only.push(m);
    }
  }

  return { common, conflict, complex, modifier_conflict, auxiliary };
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderChips(items, type) {
  if (!items || items.length === 0) {
    return '<span class="chip">—</span>';
  }
  return items.map(s => `<span class="chip ${type}">${escapeHtml(s)}</span>`).join("");
}

function renderL2Block(L2, label) {
  return `
    <div class="system">
      <div class="system-label">${label}</div>
      <h3>process(動きの順序)</h3>
      <div class="process-flow">${L2.process.length ? L2.process.map(escapeHtml).join(" → ") : "(なし)"}</div>
      <h3>direction</h3>
      <div class="chips">${renderChips([L2.direction], "direction")}</div>
      <h3>modifier</h3>
      <div class="chips">${renderChips(L2.modifier, "modifier")}</div>
      ${L2.tags.length ? `
        <h3>tags(媒介サブルール)</h3>
        <div class="chips">${renderChips(L2.tags, "tag")}</div>
      ` : ""}
    </div>
  `;
}

function renderIntersection(intersection) {
  const card = (cls, label, items, renderFn) => `
    <div class="intersection-card ${cls}">
      <div class="label">${label}</div>
      ${items.length ? items.map(renderFn).join("") : '<div class="empty">なし</div>'}
    </div>
  `;

  return `
    <div class="intersection-grid">
      ${card("common", "COMMON · 共通強化", intersection.common,
        item => `<div class="item">${escapeHtml(item)}</div>`)}
      ${card("conflict", "CONFLICT · 矛盾(駆動力)", intersection.conflict,
        item => `<div class="item">${item.axis}: ${item.kotodama} ↔ ${item.numerology} <span style="color:var(--ink-3)">[${item.type}]</span></div>`)}
      ${card("complex", "COMPLEX · 干渉(包含/動的×静的)", intersection.complex,
        item => `<div class="item">${item.axis}: ${item.kotodama} × ${item.numerology} <span style="color:var(--ink-3)">[${item.relation}]</span></div>`)}
      ${card("tension", "TEMPO TENSION · テンポ張力", intersection.modifier_conflict,
        item => `<div class="item">${item.kotodama} ↔ ${item.numerology}</div>`)}
      ${card("auxiliary", "AUXILIARY · 片側のみ", [
        ...intersection.auxiliary.kotodama_only.map(m => `言霊のみ: ${m}`),
        ...intersection.auxiliary.numerology_only.map(m => `数秘のみ: ${m}`)
      ], item => `<div class="item">${escapeHtml(item)}</div>`)}
    </div>
  `;
}

// 数秘の複数数字を1つのL2に集約する
function buildNumerologyAggregateL2(n_L1) {
  const dirCount = {};
  const motionMap = {}; // motion -> 累積weight
  const modSet = new Set();
  const allMotionInOrder = [];
  const motionSeen = new Set();

  for (const [num, def] of Object.entries(n_L1.numbers)) {
    const w = def.weight || 1.0;
    dirCount[def.direction] = (dirCount[def.direction] || 0) + w;
    for (const m of def.motion) {
      motionMap[m] = (motionMap[m] || 0) + w;
      if (!motionSeen.has(m)) {
        motionSeen.add(m);
        allMotionInOrder.push(m);
      }
    }
    for (const mod of def.modifier) modSet.add(mod);
  }

  // 代表direction
  const direction = Object.entries(dirCount)
    .sort((a, b) => b[1] - a[1])[0]?.[0] || "中立";

  // motion順序:出現順を保持
  const process = orderMotion(allMotionInOrder);

  // tags
  const tags = [];
  if (process.includes("接続")) {
    for (const mod of [...modSet]) tags.push(`接続_${mod}`);
  }

  return {
    process,
    direction,
    modifier: [...modSet],
    tags
  };
}

   ============================================================ */

// 5軸:scale / openness / stability / visibility / constraint
// 値:数値(±)。1音あたり最大2軸まで。性格ワード禁止。
const SURNAME_INTERFACE = {
  // 母音
  "あ": { openness: +2, scale: +1 },
  "い": { visibility: -1, constraint: +1 },
  "う": { openness: -2, scale: -1 },
  "え": { openness: +1, visibility: +1 },
  "お": { openness: +2, visibility: +1 },
  // プリセット必須音
  "し": { constraint: +1, stability: +1 },
  "た": { scale: +1, constraint: +1 },
  "な": { stability: +2, openness: +1 },
  "の": { openness: +1, stability: +1 },
  "ら": { openness: +1, visibility: +1 },
  "わ": { openness: +1, stability: +1 },
  "む": { openness: -2, visibility: -1 },
  "か": { scale: +1, visibility: +1 },
  "て": { constraint: +1, visibility: +1 },
  "み": { visibility: +1, stability: +1 },
  "と": { scale: +1, openness: +1 },
  // 主要音
  "こ": { stability: +2, constraint: +1 },
  "さ": { openness: +1, visibility: +1 },
  "つ": { scale: +1, constraint: +1 },
  "は": { openness: +2, visibility: +1 },
  "ま": { stability: +2, openness: +1 },
  "や": { openness: +1, visibility: -1 },
  // グライド音(拗音用)
  "ゃ": { openness: +1 },
  "ゅ": { openness: -1 },
  "ょ": { visibility: -1 },
};

// 姓のインターフェース特性を集計
function getSurnameInterface(lastName) {
  if (!lastName) return null;
  
  const sounds = decomposeSounds(lastName);
  const counter = {};
  const scores = {
    scale: 0,
    openness: 0,
    stability: 0,
    visibility: 0,
    constraint: 0
  };
  
  for (const { ch, weight } of sounds) {
    const def = SURNAME_INTERFACE[ch];
    if (!def) continue;
    counter[ch] = (counter[ch] || 0) + 1;
    const decay = Math.pow(0.5, counter[ch] - 1);
    const w = decay * weight;
    
    for (const [axis, value] of Object.entries(def)) {
      scores[axis] += value * w;
    }
  }
  
  // 強度ラベル化
  const labelize = v => {
    if (v >= 3.0) return "very high";
    if (v >= 1.5) return "high";
    if (v >= 0.5) return "medium";
    if (v >= -0.5) return "neutral";
    if (v >= -1.5) return "low";
    return "very low";
  };
  
  const labels = {};
  for (const [axis, v] of Object.entries(scores)) {
    labels[axis] = labelize(v);
  }
  
  return {
    sounds: sounds.map(s => s.ch),
    raw_scores: scores,
    labels
  };
}

   8.6 数秘補正辞書 v0.1(叩き台)
        数秘 = エネルギー条件(構造ではない・調整だけ)
   ============================================================ */

// 4軸:weight / priority / persistence / timing
// motion を作らない・あくまで調整
const NUMEROLOGY_ADJUST = {
  "1":  { weight: +2, priority: "起点", timing: "immediate" },
  "2":  { weight: -1, priority: "接続", timing: "delayed" },
  "3":  { weight: +1, priority: "拡散", persistence: -1 },
  "4":  { weight:  0, persistence: +2, timing: "early" },
  "5":  { weight: +1, priority: "拡散", timing: "cyclic", persistence: -1 },
  "6":  { weight:  0, priority: "接続", persistence: +1 },
  "7":  { weight: -1, priority: "収束", persistence: +2 },
  "8":  { weight: +2, priority: "拡散", persistence: +1, timing: "immediate" },
  "9":  { weight:  0, priority: "収束", persistence: +1, timing: "delayed" },
  "11": { weight: +2, priority: "接続", timing: "immediate" },
  "22": { weight: +2, persistence: +2, timing: "early" },
  "33": { weight: +1, priority: "接続", persistence: +2 },
};

// 数秘から補正を集計(複数数字の補正を合算)
function getNumerologyAdjustment(n_L1) {
  if (!n_L1 || !n_L1.numbers) return null;
  
  const adj = {
    weight: 0,
    priority: [],     // 複数同居可
    persistence: 0,
    timing: []        // 複数同居可(矛盾は意味として保持)
  };
  
  for (const [num, def] of Object.entries(n_L1.numbers)) {
    const adjDef = NUMEROLOGY_ADJUST[num];
    if (!adjDef) continue;
    const w = def.weight || 1.0; // 重複強調 ×2.0 を反映
    
    if (typeof adjDef.weight === "number") {
      adj.weight += adjDef.weight * w;
    }
    if (typeof adjDef.persistence === "number") {
      adj.persistence += adjDef.persistence * w;
    }
    if (adjDef.priority && !adj.priority.includes(adjDef.priority)) {
      adj.priority.push(adjDef.priority);
    }
    if (adjDef.timing && !adj.timing.includes(adjDef.timing)) {
      adj.timing.push(adjDef.timing);
    }
  }
  
  return adj;
}

/* ============================================================
   8.7 Adjust:名のL2を数秘で補正(構造は変えず、強度・優先度・テンポ)
   ============================================================ */

function adjustWithNumerology(firstName_L2, numerologyAdj) {
  if (!firstName_L2) return null;
  
  // 構造はそのまま、補正を「メタデータ」として付ける
  // motionの並び替え:数秘priorityで指定されたmotionを先頭に持ってくる
  let process = [...firstName_L2.process];
  if (numerologyAdj && numerologyAdj.priority.length > 0) {
    // priorityで指定されたmotionが process にあれば、その順に並べ替え
    const reordered = [];
    for (const p of numerologyAdj.priority) {
      if (process.includes(p)) {
        reordered.push(p);
      }
    }
    // 残りを元の順で追加
    for (const m of process) {
      if (!reordered.includes(m)) reordered.push(m);
    }
    process = reordered;
  }
  
  return {
    process,
    direction: firstName_L2.direction,
    modifier: firstName_L2.modifier,
    tags: firstName_L2.tags,
    adjustments: numerologyAdj  // 強度・持続・タイミングは別フィールド
  };
}

// 名×姓 interaction 判定
// レイ提言:一致(自然発現) / 衝突(内外ズレ) / 張力(状況依存)
function computeNameSurnameInteraction(adjustedState, surnameInterface) {
  if (!surnameInterface) return null;
  
  const labels = surnameInterface.labels;
  const direction = adjustedState.direction;
  const process = adjustedState.process;
  
  const observations = [];
  
  // direction × openness の関係
  const opennessHigh = ["high", "very high"].includes(labels.openness);
  const opennessLow = ["low", "very low"].includes(labels.openness);
  
  if (direction === "外向" && opennessHigh) {
    observations.push({ type: "一致", note: "外向きの動きが、開放的な見え方でそのまま外に出る" });
  } else if (direction === "外向" && opennessLow) {
    observations.push({ type: "衝突", note: "外向きの動きが、閉じた見え方で外に出にくい" });
  } else if (direction === "内向" && opennessHigh) {
    observations.push({ type: "張力", note: "内向きの動きが、開放的な見え方で外に出される(状況依存)" });
  } else if (direction === "内向" && opennessLow) {
    observations.push({ type: "一致", note: "内向きの動きが、閉じた見え方でそのまま内に保たれる" });
  }
  
  // 拡散 × visibility の関係
  if (process.includes("拡散")) {
    if (["high", "very high"].includes(labels.visibility)) {
      observations.push({ type: "一致", note: "広げる動きが、目立って外に出る(派手に広がる)" });
    } else if (["low", "very low"].includes(labels.visibility)) {
      observations.push({ type: "衝突", note: "広げる動きが、目立たない見え方に押し込められる(内部で広がる)" });
    }
  }
  
  // 保持 × stability の関係
  if (process.includes("保持")) {
    if (["high", "very high"].includes(labels.stability)) {
      observations.push({ type: "一致", note: "保つ動きが、安定した見え方で長く続く" });
    }
  }
  
  // 切断 × constraint の関係
  if (process.includes("切断")) {
    if (["high", "very high"].includes(labels.constraint)) {
      observations.push({ type: "一致", note: "確定させる動きが、枠を持って出る" });
    }
  }
  
  return observations;
}

    const list = n_adj.priority.map(p => priorityMap[p] || p);
    if (list.length === 1) {

    } else {

  else if (n_adj.persistence <= -0.5) phrases.push("動きに波が出やすい");

    };

  if (["high", "very high"].includes(labels.scale)) phrases.push("大きなスケール感で出る");
  if (["high", "very high"].includes(labels.stability)) phrases.push("安定した形で出る");
  
  if (["high", "very high"].includes(labels.visibility)) phrases.push("目立った見え方になる");
  else if (["low", "very low"].includes(labels.visibility)) phrases.push("目立たない見え方になる");
  
  if (["high", "very high"].includes(labels.constraint)) phrases.push("形式や枠を伴って出る");
  
  if (phrases.length === 0) {
    return ["お苗字からの出方は、特に強い特徴なく、自然な見え方になる傾向です。"];
  }
  
  paragraphs.push(
    `お苗字から見えてくるのは、あなたの内側の動きが「外にどう出るか」という見え方の特徴です。`
  );
  paragraphs.push(
    `あなたの動きは、${phrases.join("、")}傾向があるかもしれません。`
  );
  paragraphs.push(
    `お苗字は性格そのものを決めるものではなく、内側の動きが社会や周囲にどう現れるかを形作る、出力のフレームのような役割を持ちます。`
  );
  
  return paragraphs;
}

// 名×姓 interaction の記述
function buildInteractionNarrative(interactions) {
  if (!interactions || interactions.length === 0) return null;
  
  const paragraphs = [];
  const matches = interactions.filter(o => o.type === "一致");
  const conflicts = interactions.filter(o => o.type === "衝突");
  const tensions = interactions.filter(o => o.type === "張力");
  
  if (matches.length > 0) {
    paragraphs.push(
      `内側の動きと、外への出方が重なる部分があります。具体的には、${matches.map(m => m.note).join("。また、")}、という発現パターンが起きやすいかもしれません。`
    );
  }
  
  if (conflicts.length > 0) {
    paragraphs.push(
      `内側の動きと、外への出方がうまく噛み合わない部分もあります。${conflicts.map(c => c.note).join("。あるいは、")}、という形で内外がズレる場面があるかもしれません。もし「やりたいのにうまく出せない」という感覚があるとすれば、このズレが関係している可能性があります。`
    );
  }
  
  if (tensions.length > 0) {
    paragraphs.push(
      `状況によって発現が変わる部分もあります。${tensions.map(t => t.note).join("。また、")}、という形で、場面ごとに動きが変わって見えるかもしれません。`
    );
  }
  
  return paragraphs;
}

// 行動ヒント
function buildActionHints(fn_L2, n_adj, interactions) {
  if (!fn_L2) return null;
  const hints = [];
  
  if (n_adj && n_adj.priority.length > 0) {
    const p = n_adj.priority[0];
    const hintMap = {
      "起点": "「まず動き出す」を意識的に試してみてください。考える前に手を動かすと、本来の力が出やすいかもしれません。",
      "拡散": "「外に広げる」を試してみてください。一人で抱え込むより、人に話す・公開する方が動きが活きやすいかもしれません。",
      "収束": "「絞り込む」を試してみてください。広げるより、深めることに時間を使う方が、本来の力が出やすいかもしれません。",
      "接続": "「人とつなぐ」を試してみてください。一人で完結させるより、誰かと関わる場面で動きが活きやすいかもしれません。",
      "切断": "「区切りをつける」を試してみてください。曖昧なまま続けるより、明確に決め切る方が前に進みやすいかもしれません。",
      "保持": "「守り続ける」を試してみてください。短期で結果を出すより、長く続けることで力が積み上がるタイプかもしれません。"
    };
    if (hintMap[p]) hints.push(hintMap[p]);
  }
  
  if (interactions) {
    const conflicts = interactions.filter(o => o.type === "衝突");
    if (conflicts.length > 0) {
      hints.push(
        "もし内側の動きと、外への出方にズレを感じる場面があれば、それは「あなたが弱いから」ではなく「インターフェースの形」の話かもしれません。出し方を少し工夫することで、本来の動きが届きやすくなる可能性があります。"
      );
    }
  }
  
  return hints.length > 0 ? hints : null;
}

function buildPromptInput(firstName, lastName, adjustedState, ln_interface, n_adj) {
  const weightLabel = n_adj && n_adj.weight >= 2 ? "強い" : n_adj && n_adj.weight <= -1 ? "弱め" : "標準";
  const persistLabel = n_adj && n_adj.persistence >= 2 ? "長続き" : n_adj && n_adj.persistence <= -1 ? "波あり" : "標準";
  const timingMap = { immediate:"すぐに動き始める", delayed:"じっくり時間をかけて動く", cyclic:"繰り返しながら動く", early:"早めに動き始める" };
  const timingStr = n_adj && n_adj.timing ? n_adj.timing.map(t => timingMap[t]||t).join(" + ") : "標準";
  const interStr = adjustedState && adjustedState.interaction ? adjustedState.interaction.map(o=>`${o.type}: ${o.note}`).join("\n") : "（姓未入力）";
  return `◆ 名(エンジン)
動きの方向: ${adjustedState ? adjustedState.direction : "不明"}
プロセス: ${adjustedState ? adjustedState.process.join(" → ") : "不明"}
修飾: ${adjustedState && adjustedState.modifier && adjustedState.modifier.length ? adjustedState.modifier.join(", ") : "なし"}
数秘補正後の優先motion: ${n_adj && n_adj.priority && n_adj.priority.length ? n_adj.priority.join(", ") : "なし"}

◆ 数秘(エネルギー条件)
強度: ${weightLabel} / 持続性: ${persistLabel} / タイミング: ${timingStr}

◆ 姓(インターフェース)

◆ 名×姓 interaction
${interStr}`;
}

function shouldUseSonnet(idx, text, n_adj) {
  if (idx === 0) return true;
  if (!text) return false;
  if (!/たとえば|会議|誰か|場面|場合/.test(text)) return true;
  if (n_adj && n_adj.priority && n_adj.priority.length >= 2) return true;
  if (n_adj && n_adj.timing && n_adj.timing.includes("immediate") && n_adj.timing.includes("delayed")) return true;
  return false;
}

async function selfCheck(text) {
  const p = `以下の文章を読み、不自然な表現・意味ズレしている動詞や比喩があれば「NG: 箇所 → 修正案」の形で1行だけ返してください。なければ「OK」とだけ返してください。\n\n---\n${text}`;
  return (await callProxy(p, "claude-haiku-4-5-20251001", 60)).trim();
}

async function callProxy(prompt, model, maxTokens) {
  const resp = await fetch(PROXY_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model, max_tokens: maxTokens||550, temperature: 0.5, messages: [{ role:"user", content:prompt }] })
  });
  if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${resp.status}`); }
  const data = await resp.json();
  return data.content?.map(c=>c.text||"").join("") || "";
}

async function generateL3WithAI(firstName, lastName, fn_L1, fn_L2, adjustedState, output, ln_interface, n_L1, n_adj, containerEl) {
  const stateWithInteraction = adjustedState ? { ...adjustedState, interaction: output ? output.interaction : null } : null;
  const inputData = buildPromptInput(firstName, lastName, stateWithInteraction, ln_interface, n_adj);
  const sections = buildSectionPrompts(inputData);
  containerEl.innerHTML = `<div class="l3-final">
    <div class="l3-header">
      <div class="label">FINAL OUTPUT · AI生成 · Haiku/Sonnet ハイブリッド</div>
      <div class="title">あなたの構造の仮説</div>
    </div>
    ${sections.map((s,i)=>`<div class="l3-ai-section" id="l3-sec-${i}">
      <div class="section-title">${s.title}</div>
      <div class="l3-loading" id="l3-loading-${i}">生成中...</div>
    </div>`).join("")}
    <p class="note" style="margin-top:24px;text-align:center;font-size:11px;">
      ※KOTONEは仮説を提示するツールです。当てはまるかどうかは、ご自身の体感と照らし合わせてください。
    </p>
  </div>`;
  await runSection(0, sections[0], n_adj);
  for (let i = 1; i < sections.length; i++) await runSection(i, sections[i], n_adj);
}

async function runSection(idx, secDef, n_adj) {
  const loadEl = document.getElementById(`l3-loading-${idx}`);
  const secEl  = document.getElementById(`l3-sec-${idx}`);
  if (!loadEl || !secEl) return;
  const haiku  = "claude-haiku-4-5-20251001";
  const sonnet = "claude-sonnet-4-5";
  const base   = secDef.forceModel || haiku;
  try {
    loadEl.textContent = `生成中... (${secDef.forceModel ? "Sonnet" : "Haiku"})`;
    let text = await callProxy(secDef.prompt, base, 550);
    let usedModel = secDef.forceModel ? "Sonnet" : "Haiku";
    if (!secDef.forceModel && shouldUseSonnet(idx, text, n_adj)) {
      loadEl.textContent = "Sonnetで再生成中...";
      text = await callProxy(secDef.prompt, sonnet, 550);
      usedModel = "Sonnet↑";
    }
    loadEl.textContent = "言葉チェック中...";
    const checkResult = await selfCheck(text);
    const checkOk = checkResult.trim() === "OK";
    if (!checkOk) {
      loadEl.textContent = "修正中...";
      text = await callProxy(secDef.prompt + `\n\n【前回の問題点】\n${checkResult}\n上記を修正して再生成してください。`, sonnet, 550);
      usedModel = "Sonnet修";
    }
    loadEl.remove();
    const titleEl = secEl.querySelector(".section-title");
    titleEl.innerHTML = secDef.title
      + `<span class="model-badge">${usedModel}</span>`
      + (checkOk ? `<span class="l3-check-badge ok">✓ check</span>` : `<span class="l3-check-badge retry">修正済</span>`);
    const pEl = document.createElement("p");
    pEl.textContent = text;
    secEl.appendChild(pEl);
  } catch(e) {
    loadEl.className = "";
    loadEl.innerHTML = `<span style="color:var(--accent);font-size:12px;">エラー: ${String(e.message||e)}</span>`;
  }
}

// === 数秘L3結論文の組み立て ===
function buildNumerologyL3(n_L1) {
  // 主軸数字を決定:weight が最大の数字、同じならマスター数優先、それ以外は数値順
  const entries = Object.entries(n_L1.numbers);
  if (entries.length === 0) return null;
  
  entries.sort((a, b) => {
    const wDiff = b[1].weight - a[1].weight;
    if (wDiff !== 0) return wDiff;
    const aMaster = ["11", "22", "33"].includes(a[0]);
    const bMaster = ["11", "22", "33"].includes(b[0]);
    if (aMaster && !bMaster) return -1;
    if (!aMaster && bMaster) return 1;
    return parseInt(a[0]) - parseInt(b[0]);
  });
  
  const main = entries[0];
  const others = entries.slice(1);
  const mainNum = main[0];
  const mainData = NUMEROLOGY_L3[mainNum];
  if (!mainData) return null;
  
  const paragraphs = [];
  
  // 第1段落:本質
  paragraphs.push(`お誕生日から導かれるあなたは、${mainData.人物像_長}です。`);
  
  // 第2段落:重複強調(あれば)
  if (main[1].weight >= 2.0) {
    paragraphs.push(
      `特に${mainData.力名}が二重に重なって表れており、` +
      `${mainData.行動傾向}傾向が際立って強く出ます。`
    );
  }
  
  // 第3段落:組み合わせ
  if (others.length > 0) {
    const otherMain = others[0];
    const otherData = NUMEROLOGY_L3[otherMain[0]];
    if (otherData) {
      const mainDir = NUMEROLOGY_L1[mainNum] && NUMEROLOGY_L1[mainNum].direction;
      const otherDir = NUMEROLOGY_L1[otherMain[0]] && NUMEROLOGY_L1[otherMain[0]].direction;
      const isConflict = (mainDir === "外向" && otherDir === "内向") ||
                         (mainDir === "内向" && otherDir === "外向");
      
      if (isConflict) {
        paragraphs.push(
          `${mainData.役割語}、同時に${otherData.役割語}という、` +
          `一見矛盾する二つの力を併せ持っています。` +
          `この内的なせめぎ合いが、あなたを動かす駆動力となるでしょう。`
        );
      } else {
        paragraphs.push(
          `加えて${otherData.力名}も併せ持っており、` +
          `${otherData.キーワード[0]}と${mainData.キーワード[0]}が組み合わさることで、` +
          `独自の存在感を作り出します。`
        );
      }
    }
  }
  
  // マスター数の追加レイヤー(主軸でない場合のみ)
  const masterEntry = entries.find(e => ["11", "22", "33"].includes(e[0]));
  if (masterEntry && masterEntry[0] !== mainNum) {
    const masterData = NUMEROLOGY_L3[masterEntry[0]];
    paragraphs.push(
      `さらに${masterData.キーワード[0]}が加わることで、` +
      `${masterData.人物像_中}としての側面も持ち合わせています。`
    );
  }
  
  // 第4段落:行動傾向(常体素材を「〜傾向があります」で丁寧化)
  paragraphs.push(`${mainData.行動傾向}傾向があります。`);
  
  // 第5段落:光と影(常体素材を「〜こともあるでしょう」で丁寧化)
  paragraphs.push(`ただし、${mainData.光と影}でしょう。`);
  
  return paragraphs;
}

// === 言霊L3結論文の組み立て ===
function buildKotodamaL3(k_L1, k_L2) {
  if (!k_L1 || !k_L2) return null;
  
  const dir = k_L2.direction;
  const dirData = KOTODAMA_L3_DIRECTION[dir];
  if (!dirData) return null;
  
  const paragraphs = [];
  
  // 第1段落:本質
  paragraphs.push(`お名前から導かれるあなたは、${dirData.フレーズ_長}です。`);
  
  // 第2段落:processの組合せ修飾
  const modifications = [];
  for (const m of k_L2.process) {
    if (dirData.組合せ修飾[m]) {
      modifications.push(dirData.組合せ修飾[m]);
    }
  }
  if (modifications.length > 0) {
    const list = modifications.slice(0, 3); // 最大3つ
    if (list.length === 1) {
      paragraphs.push(`${list[0]}力を持っています。`);
    } else if (list.length === 2) {
      paragraphs.push(`${list[0]}力と、${list[1]}力を併せ持っています。`);
    } else {
      paragraphs.push(`${list[0]}力、${list[1]}力、そして${list[2]}力を併せ持っています。`);
    }
  }
  
  // 第3段落:50音マスター素材を補強的に注入
  // 採用音:重複していない最初の3音まで
  const seenSounds = new Set();
  const uniqueSounds = [];
  for (const s of k_L1.sounds) {
    const ch = DAKUON_MAP[s] || s;
    if (!seenSounds.has(ch) && SOUND_MATERIAL[ch]) {
      seenSounds.add(ch);
      uniqueSounds.push(ch);
    }
    if (uniqueSounds.length >= 3) break;
  }
  if (uniqueSounds.length > 0) {
    const materials = uniqueSounds.map(s => SOUND_MATERIAL[s]);
    let sentence;
    if (materials.length === 1) {
      sentence = `${materials[0]}が、その軸を支えています。`;
    } else if (materials.length === 2) {
      sentence = `${materials[0]}と、${materials[1]}。これらが組み合わさって、独自の人物像を形作っています。`;
    } else {
      sentence = `${materials[0]}、${materials[1]}、${materials[2]}。これらが組み合わさって、独自の人物像を形作っています。`;
    }
    paragraphs.push(sentence);
  }
  
  // 第4段落:シャドー(光と影)
  const shadow = matchShadow(k_L2);
  if (shadow) {
    paragraphs.push(`ただし、${shadow.typical}でしょう。${shadow.impression}でしょう。`);
  }
  
  return paragraphs;
}

// シャドーマッチング
function matchShadow(L2) {
  let bestMatch = null;
  let bestScore = 0;
  
  for (const entry of SHADOW_TABLE) {
    const p = entry.pattern;
    let score = 0;
    let valid = true;
    
    // direction一致
    if (p.direction && L2.direction === p.direction) {
      score += 3;
    } else if (p.direction) {
      valid = false;
    }
    
    // motion部分一致
    if (p.motion) {
      let motionMatch = 0;
      for (const m of p.motion) {
        if (L2.process.includes(m)) motionMatch++;
      }
      if (motionMatch === p.motion.length) score += 2;
      else if (motionMatch > 0) score += 1;
      else valid = false;
    }
    
    // modifier部分一致
    if (p.modifier && p.modifier.length > 0) {
      for (const mod of p.modifier) {
        if (L2.modifier.includes(mod)) score += 1;
      }
    }
    
    if (valid && score > bestScore) {
      bestScore = score;
      bestMatch = entry;
    }
  }
  
  return bestMatch;
}

      `それぞれ独立した側面として、あなたの人物像を立体的に形作っています。`
    );
  }
  
  return paragraphs;
}

// === 統合「光と影」セクション ===
function buildShadowL3(k_L2, n_L1, intersection) {
  const paragraphs = [];
  
  // 言霊側のシャドー
  if (k_L2) {
    const shadow = matchShadow(k_L2);
    if (shadow) {
      paragraphs.push(`${shadow.typical}でしょう。${shadow.impression}でしょう。`);
    }
  }
  
  // 数秘側の崩れ方(主軸の数字から)
  if (n_L1 && n_L1.numbers) {
    const entries = Object.entries(n_L1.numbers);
    entries.sort((a, b) => b[1].weight - a[1].weight);
    if (entries.length > 0) {
      const mainNum = entries[0][0];
      const mainData = NUMEROLOGY_L3[mainNum];
      if (mainData) {
        paragraphs.push(`また、${mainData.光と影}でしょう。`);
      }
    }
  }
  
  if (paragraphs.length === 0) {
    paragraphs.push("光と影の構造は、入力情報からは読み取れませんでした。");
  }
  
  return paragraphs;
}

// === キャッチコピー生成プロンプト(Haiku呼び出し用・現状はプロンプト例の表示のみ) ===
function buildCatchPromptExample(k_L2, n_L1, intersection) {
  const keywords = [];
  
  if (k_L2 && KOTODAMA_L3_DIRECTION[k_L2.direction]) {
    keywords.push(...KOTODAMA_L3_DIRECTION[k_L2.direction].キーワード.slice(0, 2));
  }
  
  if (n_L1 && n_L1.numbers) {
    const entries = Object.entries(n_L1.numbers);
    entries.sort((a, b) => b[1].weight - a[1].weight);
    for (const [num, _] of entries.slice(0, 2)) {
      const d = NUMEROLOGY_L3[num];
      if (d) keywords.push(...d.キーワード.slice(0, 2));
    }
  }
  
  // ユニーク化
  const unique = [...new Set(keywords)];
  
  return {
    keywords: unique,
    prompt: `以下のキーワードから、その人を表す20-30字のキャッチコピーを1つ生成してください。\n\nキーワード:${unique.join("、")}\n\n条件:\n・1文で完結\n・体言止め可\n・占い・スピリチュアル臭を抑える\n・キーワードを1-2個取り入れる\n・現代的で読みやすい言葉遣い`
  };
}

// === L3全体を組み立てる ===
function buildL3(k_L1, k_L2, n_L1, intersection) {
  const sections = {};
  
  // セクション1:お名前から(言霊)
  if (k_L2) {
    sections.kotodama = buildKotodamaL3(k_L1, k_L2);
  }
  
  // セクション2:お誕生日から(数秘)
  if (n_L1) {
    sections.numerology = buildNumerologyL3(n_L1);
  }
  
  // セクション3:統合
  if (intersection) {
    sections.integration = buildIntegrationL3(intersection);
  }
  
  // セクション4:光と影
  sections.shadow = buildShadowL3(k_L2, n_L1, intersection);
  
  // セクション5:キャッチコピー(プロンプト例のみ)
  sections.catch_prompt = buildCatchPromptExample(k_L2, n_L1, intersection);
  
  return sections;
}

// === L3レンダリング ===
function renderL3(L3) {
  if (!L3) return "";
  
  const renderSection = (title, paragraphs) => {
    if (!paragraphs || paragraphs.length === 0) return "";
    return `
      <div class="l3-section">
        <div class="section-title">${title}</div>
        ${paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join("")}
      </div>
    `;
  };
  
  let html = `<div class="l3-final">
    <div class="l3-header">
      <div class="label">FINAL OUTPUT</div>
      <div class="title">あなたの診断結果</div>
    </div>`;
  
  if (L3.kotodama) html += renderSection("お名前から導かれるあなた", L3.kotodama);
  if (L3.numerology) html += renderSection("お誕生日から導かれるあなた", L3.numerology);
  if (L3.integration) html += renderSection("二つを重ねて見えてくる、あなたの人物像", L3.integration);
  if (L3.shadow) html += renderSection("光と影", L3.shadow);
  
  // キャッチコピー(プロンプト例)
  if (L3.catch_prompt) {
    html += `
      <div class="l3-catch">
        <div class="catch-label">CATCH COPY (LLM呼び出し)</div>
        <div class="catch-text">[ Haiku呼び出しでここにキャッチが入る ]</div>
        <div class="catch-note">本番ではバックエンドからHaikuを呼び出して生成。今回はプロンプト例のみ。</div>
      </div>
      <details style="margin-top:16px">
        <summary>キャッチ生成のプロンプト例(Haiku呼び出し用)</summary>
        <pre>${escapeHtml(L3.catch_prompt.prompt)}</pre>
        <p class="note">抽出キーワード:${L3.catch_prompt.keywords.join("、")}</p>
      </details>
    `;
  }
  
  html += "</div>";
  return html;
}
